name: Generated design looks wrong
description: A MobileCopilot or MobileDSL design compiled, but the robot, world or behavior is not right.
labels: ["design report"]
body:
  - type: markdown
    attributes:
      value: |
        Failed designs become test cases for the next release. In the Studio, **Report issue & help us improve** sends the program, the compiler log and the render for you; use this form when that is not possible.
        **Never paste an API key.** Keys starting with `sk-`, `sk-ant-` or `AIza` should not appear anywhere in the issue.
  - type: textarea
    id: request
    attributes:
      label: What you asked for
      description: The request or reference image you gave the copilot, or what you meant to write.
    validations:
      required: true
  - type: textarea
    id: program
    attributes:
      label: MobileDSL program
      description: The robot, world, task and evaluate blocks.
      render: text
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What looks wrong
      description: For example, a wheel below the floor, an arm mounted inside the chassis or a footprint far larger than the robot. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Compiler output
      description: Diagnostics or terminal lines from the Studio, if any.
      render: text
